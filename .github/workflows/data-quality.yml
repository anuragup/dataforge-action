name: Data Quality
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run DataForge
        uses: ./
        with:
          input: data/*.csv
          fail_below_score: 0
          post_summary: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload HTML Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: data-quality-report
          path: "**/*_report.html"
          retention-days: 30
      - name: Upload Cleaned Data
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cleaned-data
          path: "**/*_clean.*"
          retention-days: 30
